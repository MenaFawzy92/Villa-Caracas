kind = "web"
previewPath = "/"
title = "Villa Caracas"
description = "A refined restaurant website for Villa Caracas, a premium Lebanese dining destination in Maadi, Cairo, featuring the menu, reservation links, location, hours, and social presence."
version = "1.0.0"
id = "artifacts/villa-caracas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20204

[services.development]
run = "pnpm --filter @workspace/villa-caracas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/villa-caracas", "run", "build" ]
serve = "static"
publicDir = "artifacts/villa-caracas/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20204"
BASE_PATH = "/"
